<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <title>MedStock - insumos</title>

<body>
    <aside>
        <img src="./img/logo-medicamento.png" alt="logo" class="logo_menu">
        <nav class="sidebar">
            <div class="menu">
                <a href="#"><i class="fa-solid fa-chart-simple"></i><span>Dashboard</span></a>
            <a href="unidade.html"><i class="fa-solid fa-house-medical"></i><span>Unidades de saúde</span></a>
            <a href="produto.html"><i class="fa-solid fa-boxes-stacked"></i><span>Produtos</span></a>

                    <strong>134</strong>
                    <p>unidades cadastradas</p>

            <article id="box_pedido" class="box">
                    <strong>134</strong>
                    <p>Pedidos Necessários</p>
            </article>
            
            <article id="box_produto" class="box">
                    <strong>134</strong>

        <section id="grafico_container">

                    <option value="1">Mês 1</option>

        <section id="tabela_estoque">

        </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
