<!doctype html>
<html lang="pt-br">
  <head>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/unidade.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedStock - Unidades de Saúde</title>
  </head>
  <body>
    <aside class="sidebar-container">
      <img src="./img/logo-medicamento.png" alt="logo" class="logo_menu" />
      <nav class="sidebar">
        <div class="menu">
          <a id="menuDashboard" href="dashboard.html" ><i class="fa-solid fa-chart-simple"></i><span>Dashboard</span></a>
          <a id="menuUnidades" class="ativo" href="unidade.html"><i class="fa-solid fa-house-medical"></i><span>Unidades de saúde</span></a>
          <a href="produto.html"><i class="fa-solid fa-boxes-stacked"></i><span>Produtos</span></a>
          <a href="movimentacao.html"><i class="fa-solid fa-arrow-right-arrow-left"></i><span>Movimentação</span></a>
          <a id="menuUsuarios" href="usuarios.html"><i class="fa-solid fa-user"></i><span>Usuários</span></a>
        </div>
      </nav>
      <button class="btn-sair" onclick="logout()">Sair </button>
      <div class="footer">© 2026 MedStock</div>
    </aside>

    <main>
      <div class="topbar">
        <h1>Unidades de Saúde</h1>
        <button class="btn-nova-unidade" onclick="abrirModalNovaUnidade()"><i class="fa-solid fa-plus"></i> Nova Unidade </button>
      </div>

      <section class="secao-unidades">
        <div id="filtros" class="pesquisa_unidade">
          <input type="text" id="filtroTabela" placeholder=" Buscar..." class="input-filtro" />
        </div>

        <div class="tabela-container">
          <table class="tabela-unidades" id="tabelaUnidades">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Logradouro</th>
                <th>Bairro</th>
                <th>Número</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="corpoTabela">
              <tr class="linha-carregamento">
                <td colspan="5" class="texto-carregamento">
                  <i class="fa-solid fa-spinner fa-spin"></i> Carregando
                  unidades...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="paginacao" id="paginacao"></div>
      </section>
    </main>

    <!-- MODAL NOVA/EDITA UNIDADE -->
    <div id="modalNovaUnidade" class="modal">
      <div class="modal-conteudo">
        <div class="modal-header">
          <h2 id="tituloModal">Nova Unidade de Saúde</h2>
          <button class="btn-fechar" onclick="fecharModalNovaUnidade()">
            &times;
          </button>
        </div>
        <form id="formUnidade" class="form-unidade">
          <input type="hidden" id="unidadeId" />
          <div class="grupo-form">
            <label for="nome">Nome da Unidade *</label>
            <input
              type="text"
              id="nome"
              required
              placeholder="Ex: Posto de Saúde Central"
            />
          </div>

          <div class="grupo-form">
            <label for="logradouro">Logradouro *</label>
            <input
              type="text"
              id="logradouro"
              required
              placeholder="Ex: Rua das Flores"
            />
          </div>

          <div class="grupo-form-dupla">
            <div class="grupo-form">
              <label for="bairro">Bairro *</label>
              <input
                type="text"
                id="bairro"
                required
                placeholder="Ex: Centro"
              />
            </div>

            <div class="grupo-form">
              <label for="numero">Número *</label>
              <input type="text" id="numero" required placeholder="Ex: 123" />
            </div>
          </div>

          <div class="botoes-modal">
            <button
              type="button"
              class="btn-cancelar"
              onclick="fecharModalNovaUnidade()"
            >
              Cancelar
            </button>
            <button type="submit" class="btn-salvar">Salvar Unidade</button>
          </div>
        </form>
      </div>
    </div>

    <script src="./js/unidade.js"></script>
    <script src="./js/script.js"></script>    
  </body>
</html>
